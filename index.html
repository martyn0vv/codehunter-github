<!DOCTYPE html>
<html lang="en">
<head>
    <!-- let the browser read the text and fit the page to the screen -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- load the colors and stuff -->
    <link rel="stylesheet" href="style.css">
    <!-- run the js after the html is ready -->
    <script src="script.js" defer></script>
    <!-- the name on the browser tab -->
    <title>codehunter-github</title>
</head>
<body>
    <!-- big name at the top -->
    <h1>CODEHUNTER</h1>
    <!-- type a search here. closing an input tag like it owes me money -->
    <input type="text" id="Input" placeholder="Search in GIThub"></input>
    <!-- click this to start searching -->
    <button id="Button">Research</button>
    <!-- js puts the repos in this empty box -->
    <div id="result"></div>
</body>
</html>
